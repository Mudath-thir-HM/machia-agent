[project]
name = "machia"
version = "0.1.0"
description = "An agent runtime for N-ATLAS."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "colorama>=0.4.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/machia"]

[project.scripts]
machia = "machia.launcher:main"
machia-cli = "machia.cli:main"
machia-web = "machia.server.app:main"