<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Machia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #161a22;
        --border: #232935;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --indigo: #6366f1;
        --violet: #8b5cf6;
        --emerald: #10b981;
        --amber: #f59e0b;
        --rose: #f43f5e;
        --mono:
          ui-monospace, "Cascadia Code", "JetBrains Mono", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--mono);
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr;
        overflow: hidden;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(90deg, #3b82f6, #22c55e);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.5px;
      }
      .brand-sub {
        color: var(--muted);
        font-size: 11px;
        margin-top: 2px;
      }
      .section-label {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }
      .skill {
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        margin-bottom: 6px;
        cursor: default;
        font-size: 12px;
      }
      .skill-name {
        color: var(--violet);
        font-weight: 600;
      }
      .skill-desc {
        color: var(--muted);
        font-size: 11px;
        margin-top: 3px;
      }
      main {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      header {
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--panel);
      }
      header .status {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--emerald);
        box-shadow: 0 0 8px var(--emerald);
      }
      .dot.busy {
        background: var(--amber);
        box-shadow: 0 0 8px var(--amber);
      }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg {
        max-width: 900px;
        line-height: 1.5;
        font-size: 13px;
      }
      .msg.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #1e293b, #334155);
        padding: 10px 14px;
        border-radius: 10px 10px 2px 10px;
        color: var(--text);
      }
      .msg.system {
        align-self: flex-start;
        background: #052e1f;
        border-left: 3px solid var(--emerald);
        padding: 10px 14px;
        border-radius: 2px 10px 10px 10px;
        color: #d1fae5;
      }
      .msg.system .tag {
        color: var(--emerald);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
        display: block;
      }
      .msg.tool {
        align-self: flex-start;
        border-left: 3px solid var(--indigo);
        padding: 6px 12px;
        font-size: 12px;
        color: var(--muted);
        background: #121722;
        border-radius: 0 6px 6px 0;
        max-width: 700px;
      }
      .msg.tool .name {
        color: var(--indigo);
        font-weight: 600;
      }
      .msg.tool .result {
        color: var(--emerald);
      }
      .msg.tool .result.bad {
        color: var(--amber);
      }
      .msg.hint {
        align-self: flex-start;
        background: #2a1f04;
        border-left: 3px solid var(--amber);
        padding: 8px 12px;
        font-size: 11px;
        color: #fde68a;
        border-radius: 0 6px 6px 0;
        max-width: 800px;
        white-space: pre-wrap;
      }
      .msg.error {
        align-self: flex-start;
        background: #2b0a12;
        border-left: 3px solid var(--rose);
        padding: 10px 14px;
        color: #fecdd3;
        border-radius: 0 10px 10px 0;
      }
      footer {
        padding: 14px 24px 20px;
        border-top: 1px solid var(--border);
        background: var(--panel);
      }
      .input-box {
        display: flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0 12px;
        transition: border-color 0.15s;
      }
      .input-box:focus-within {
        border-color: var(--indigo);
      }
      .input-box .prefix {
        color: var(--emerald);
        margin-right: 10px;
        font-weight: 700;
      }
      input[type="text"] {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text);
        font-family: var(--mono);
        font-size: 13px;
        padding: 12px 0;
      }
      input[type="text"]::placeholder {
        color: var(--muted);
      }
      button.send {
        background: var(--indigo);
        color: white;
        border: none;
        padding: 6px 14px;
        border-radius: 5px;
        cursor: pointer;
        font-family: var(--mono);
        font-size: 12px;
        margin-left: 8px;
      }
      button.send:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Approval modal */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .overlay.show {
        display: flex;
      }
      .modal {
        background: var(--panel);
        border: 1px solid var(--amber);
        border-radius: 10px;
        padding: 20px 24px;
        max-width: 600px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      .modal h3 {
        color: var(--amber);
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 12px;
      }
      .modal pre {
        background: var(--bg);
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        color: var(--text);
        white-space: pre-wrap;
        max-height: 300px;
        overflow: auto;
        border: 1px solid var(--border);
      }
      .modal .buttons {
        display: flex;
        gap: 10px;
        margin-top: 16px;
        justify-content: flex-end;
      }
      .modal button {
        font-family: var(--mono);
        font-size: 12px;
        padding: 8px 18px;
        border-radius: 6px;
        cursor: pointer;
        border: 1px solid var(--border);
      }
      .modal .deny {
        background: transparent;
        color: var(--text);
      }
      .modal .allow {
        background: var(--emerald);
        color: #062014;
        border-color: var(--emerald);
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <aside>
      <div>
        <div class="brand">Machia</div>
        <div class="brand-sub">agent runtime · N-ATLAS</div>
      </div>

      <div>
        <div class="section-label">Skills</div>
        <div id="skills">
          <div class="skill"><div class="skill-desc">loading…</div></div>
        </div>
      </div>

      <div>
        <div class="section-label">Recent activity</div>
        <div id="audit" style="font-size: 11px; color: var(--muted)">—</div>
      </div>
    </aside>

    <main>
      <header>
        <div style="font-size: 13px; color: var(--muted)" id="workspace">…</div>
        <div class="status">
          <span class="dot" id="status-dot"></span
          ><span id="status-text">idle</span>
        </div>
      </header>

      <div id="chat"></div>

      <footer>
        <form class="input-box" id="form">
          <span class="prefix">›</span>
          <input
            type="text"
            id="input"
            placeholder="ask machia to do something…"
            autocomplete="off"
          />
          <button type="submit" class="send" id="send">send</button>
        </form>
      </footer>
    </main>

    <div class="overlay" id="overlay">
      <div class="modal">
        <h3>Approval needed</h3>
        <pre id="approval-body">…</pre>
        <div class="buttons">
          <button class="deny" id="deny">deny</button>
          <button class="allow" id="allow">allow</button>
        </div>
      </div>
    </div>

    <script>
      const chat = document.getElementById("chat");
      const input = document.getElementById("input");
      const form = document.getElementById("form");
      const send = document.getElementById("send");
      const statusDot = document.getElementById("status-dot");
      const statusText = document.getElementById("status-text");
      const overlay = document.getElementById("overlay");
      const approvalBody = document.getElementById("approval-body");

      let currentApprovalId = null;
      let currentSessionId = null;
      let busy = false;

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      }

      function addUser(text) {
        const m = el("div", "msg user", text);
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
      }

      function addTool(name, args) {
        const m = el("div", "msg tool");
        m.innerHTML = `<span class="name">→ ${name}</span>(${JSON.stringify(args)})`;
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
      }

      function addToolResult(name, result) {
        const m = el("div", "msg tool");
        const body = JSON.stringify(result).slice(0, 300);
        const isProblem = result && (result.error || result.blocked);
        m.innerHTML = `<span class="result ${isProblem ? "bad" : ""}">← ${body}</span>`;
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
      }

      function addSystem(text) {
        const m = el("div", "msg system");
        const tag = el("span", "tag", "answer");
        m.appendChild(tag);
        m.appendChild(document.createTextNode(text));
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
      }

      function addError(text) {
        const m = el("div", "msg error", text);
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
      }

      function addHint(text) {
        const m = el("div", "msg hint", text);
        chat.appendChild(m);
        chat.scrollTop = chat.scrollHeight;
      }

      function setBusy(state, label) {
        busy = state;
        send.disabled = state;
        statusDot.classList.toggle("busy", state);
        statusText.textContent = state ? label || "thinking" : "idle";
      }

      async function loadSkills() {
        try {
          const r = await fetch("/api/skills");
          const data = await r.json();
          const el = document.getElementById("skills");
          el.innerHTML = "";
          if (!data.skills || data.skills.length === 0) {
            el.innerHTML =
              '<div class="skill"><div class="skill-desc">no skills loaded</div></div>';
            return;
          }
          data.skills.forEach((s) => {
            const d = document.createElement("div");
            d.className = "skill";
            d.innerHTML = `<div class="skill-name">${s.name}</div><div class="skill-desc">${s.description}</div>`;
            el.appendChild(d);
          });
        } catch (e) {
          console.error(e);
        }
      }

      async function loadConfig() {
        try {
          const r = await fetch("/api/config");
          const data = await r.json();
          document.getElementById("workspace").textContent = data.workspace;
        } catch (e) {}
      }

      async function loadAudit() {
        try {
          const r = await fetch("/api/audit?limit=10");
          const data = await r.json();
          const el = document.getElementById("audit");
          el.innerHTML = "";
          if (!data.entries || data.entries.length === 0) {
            el.textContent = "no activity yet";
            return;
          }
          data.entries.slice(0, 8).forEach((entry) => {
            const d = document.createElement("div");
            d.style.marginBottom = "6px";
            const ok = entry.allowed !== false && entry.ok !== false;
            d.innerHTML = `<span style="color:${ok ? "var(--emerald)" : "var(--amber)"}">${entry.tool}</span> <span style="opacity:0.6">${entry.event}</span>`;
            el.appendChild(d);
          });
        } catch (e) {}
      }

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text || busy) return;
        input.value = "";
        addUser(text);
        setBusy(true, "starting");

        try {
          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text }),
          });
          if (!r.ok) throw new Error("server rejected request");
          const { session_id } = await r.json();
          currentSessionId = session_id;
          listen(session_id);
        } catch (err) {
          addError("failed to start: " + err.message);
          setBusy(false);
        }
      });

      function listen(sessionId) {
        const es = new EventSource(`/api/stream/${sessionId}`);

        es.addEventListener("tool_call", (ev) => {
          const data = JSON.parse(ev.data);
          setBusy(true, data.name);
          addTool(data.name, data.args);
        });

        es.addEventListener("tool_result", (ev) => {
          const data = JSON.parse(ev.data);
          addToolResult(data.name, data.result);
        });

        es.addEventListener("approval_needed", (ev) => {
          const data = JSON.parse(ev.data);
          currentApprovalId = data.id;
          approvalBody.textContent = data.question;
          overlay.classList.add("show");
        });

        es.addEventListener("answer", (ev) => {
          const data = JSON.parse(ev.data);
          addSystem(data.text);
          loadSkills();
          loadAudit();
        });

        es.addEventListener("error", (ev) => {
          const data = JSON.parse(ev.data);
          addError(data.text);
        });

        es.addEventListener("done", () => {
          setBusy(false);
          es.close();
          loadAudit();
        });

        es.onerror = () => {
          if (busy) setBusy(false);
          es.close();
        };
      }

      async function respond(allow) {
        if (!currentApprovalId) return;
        overlay.classList.remove("show");
        const id = currentApprovalId;
        currentApprovalId = null;
        await fetch(`/api/approve/${id}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ allow }),
        });
      }

      document.getElementById("allow").onclick = () => respond(true);
      document.getElementById("deny").onclick = () => respond(false);

      // Bootstrap
      loadConfig();
      loadSkills();
      loadAudit();
      setInterval(loadAudit, 5000);
    </script>
  </body>
</html>
